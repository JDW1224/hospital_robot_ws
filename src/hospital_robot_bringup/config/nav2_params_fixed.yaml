# Nav2 파라미터 (휠체어 로봇) - 통합 최종본
# 환경: 입구 40cm / 차폭 28cm (한쪽 여유 6cm)

amcl:
  ros__parameters:
    use_sim_time: false
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"
    tf_broadcast: true
    min_particles: 300
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.98
    z_rand: 0.02
    sigma_hit: 0.2
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.0
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}   # ← 실제 출발점으로
    transform_tolerance: 2.0
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 40.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 1.57
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0             # 후진 금지(음수 불가)
      min_vel_y: 0.0
      max_vel_x: 0.15              # 천천히 (충돌 여유)
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.4
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 30
      vy_samples: 0
      vtheta_samples: 60
      sim_time: 1.0               # 앞을 멀리 내다봐서 미리 회피
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 2.0
      xy_goal_tolerance: 0.3
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 2.0    # 0.5→10 벽 강하게 회피(중앙 경로 이탈 방지)
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 6.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0        # 경로 추종 최우선
      GoalDist.scale: 24.0        # 질러가기 더 억제
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 1.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"   # ★ NavFn→Smac2D (벽에서 떨어져 다님)
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      cost_travel_multiplier: 15.0  # 5→15 벽 비용 강하게 회피(중앙 강제)
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.1425, 0.14], [0.1425, -0.14], [-0.1425, -0.14], [-0.1425, 0.14]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0     # 완만한 경사로 벽 주변 넓게 비용
        inflation_radius: 0.10       # 48.5cm 통로 통과 가능 + 회피 작동 균형

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      footprint: "[[0.1425, 0.14], [0.1425, -0.14], [-0.1425, -0.14], [-0.1425, 0.14]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.15

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""               # ⚠️ launch에서 map:= 로 넘기거나 경로 직접 입력

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - "map_server"
      - "amcl"
      - "controller_server"
      - "planner_server"
      - "behavior_server"
      - "bt_navigator"
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0



    